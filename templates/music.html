<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor Lamp - Music</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
    <style>
        body { background: #090d16; color: #f3f4f6; font-family: sans-serif; }
        .glass { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
        .track-item.active { border-color: rgba(99,102,241,.7); background: rgba(99,102,241,.12); }
    </style>
</head>
<body class="min-h-screen p-6">
    <div class="max-w-6xl mx-auto space-y-6">
        <div class="flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-indigo-400">Study Music</h1>
                <p class="text-sm text-gray-400 mt-1">Play a calm soundtrack while you focus</p>
            </div>
            <a href="/app" class="px-4 py-2 glass rounded-xl text-sm font-semibold hover:bg-gray-800 text-gray-200">← Back to Dashboard</a>
        </div>

        <div class="grid grid-cols-12 gap-6">
            <div class="col-span-8 glass rounded-2xl p-6">
                <div class="flex items-center justify-between mb-6">
                    <div>
                        <p class="text-xs uppercase text-gray-400 tracking-[0.2em]">Now Playing</p>
                        <h2 id="currentTrackTitle" class="text-2xl font-bold text-white mt-2">Peaceful Piano Study</h2>
                    </div>
                    <div class="text-right">
                        <div id="playState" class="text-xs px-2 py-1 rounded-full bg-green-900/60 text-green-300 border border-green-500/30">Ready</div>
                    </div>
                </div>

                <div class="rounded-2xl border border-indigo-500/20 bg-slate-950/40 p-5 mb-6">
                    <div class="flex items-center justify-between text-xs text-gray-400 mb-3">
                        <span id="currentTime">0:00</span>
                        <span id="duration">0:00</span>
                    </div>
                    <input id="progress" type="range" min="0" max="100" value="0" class="w-full accent-indigo-500" />
                </div>

                <div class="flex items-center justify-center gap-4">
                    <button id="prevBtn" class="px-4 py-3 glass text-white rounded-xl font-semibold hover:bg-gray-800">⏮</button>
                    <button id="playPauseBtn" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-bold text-lg">Play</button>
                    <button id="nextBtn" class="px-4 py-3 glass text-white rounded-xl font-semibold hover:bg-gray-800">⏭</button>
                </div>
            </div>

            <div class="col-span-4 glass rounded-2xl p-6">
                <h3 class="text-sm font-bold text-gray-300 uppercase tracking-[0.2em] mb-4">Playlist</h3>
                <div id="playlist" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <audio id="audioPlayer" preload="metadata"></audio>

    <script>
        const tracks = [
            { title: 'Peaceful Piano Study', src: 'https://archive.org/download/100-piano-music-for-relaxation-sleep-zen/100%20Piano%20Music%20For%20Relaxation,%20Sleep,%20Zen%20(2020)/001.%20%20Piano%20For%20Studying%20-%20%20Peaceful%20Piano.mp3' },
            { title: 'Gymnopédie No. 1', src: 'https://archive.org/download/erik-satie-gymnopedie-no.-1_202211/Erik%20Satie%20-%20Gymnop%C3%A9die%20No.1.mp3' },
            { title: 'Quiet Morning Waltz', src: 'https://archive.org/download/100-piano-music-for-relaxation-sleep-zen/100%20Piano%20Music%20For%20Relaxation,%20Sleep,%20Zen%20(2020)/002.%20%20Piano%20Chillax%20-%20%20Piano%20Chillax.mp3' },
            { title: 'Evening Classical Flow', src: 'https://archive.org/download/erik-satie-gymnopedie-no.-1_202211/Erik%20Satie%20-%20Gymnop%C3%A9die%20No.1.mp3' }
        ];

        const audio = document.getElementById('audioPlayer');
        const playlistEl = document.getElementById('playlist');
        const currentTrackTitle = document.getElementById('currentTrackTitle');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const progress = document.getElementById('progress');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const playState = document.getElementById('playState');

        let currentIndex = 0;

        function formatTime(value) {
            if (!Number.isFinite(value)) return '0:00';
            const minutes = Math.floor(value / 60);
            const seconds = Math.floor(value % 60);
            return `${minutes}:${String(seconds).padStart(2, '0')}`;
        }

        function renderPlaylist() {
            playlistEl.innerHTML = tracks.map((track, index) => `
                <button class="track-item w-full text-left p-3 rounded-xl border border-gray-700 ${index === currentIndex ? 'active' : ''} transition hover:bg-slate-800/60" data-index="${index}">
                    <div class="flex justify-between items-center">
                        <div>
                            <div class="font-semibold text-white">${track.title}</div>
                            <div class="text-xs text-gray-400">Calm study ambience</div>
                        </div>
                        <span class="text-xs text-gray-400">${index + 1}</span>
                    </div>
                </button>
            `).join('');

            document.querySelectorAll('.track-item').forEach(button => {
                button.addEventListener('click', () => {
                    currentIndex = Number(button.dataset.index);
                    loadTrack(currentIndex);
                    audio.play();
                });
            });
        }

        function loadTrack(index) {
            currentIndex = index;
            const track = tracks[currentIndex];
            audio.src = track.src;
            currentTrackTitle.textContent = track.title;
            renderPlaylist();
            playState.textContent = 'Loading';
            playState.className = 'text-xs px-2 py-1 rounded-full bg-yellow-900/60 text-yellow-300 border border-yellow-500/30';
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
        }

        function playNext() {
            currentIndex = (currentIndex + 1) % tracks.length;
            loadTrack(currentIndex);
            audio.play();
        }

        function playPrev() {
            currentIndex = (currentIndex - 1 + tracks.length) % tracks.length;
            loadTrack(currentIndex);
            audio.play();
        }

        audio.addEventListener('loadedmetadata', () => {
            durationEl.textContent = formatTime(audio.duration || 0);
            playState.textContent = 'Playing';
            playState.className = 'text-xs px-2 py-1 rounded-full bg-green-900/60 text-green-300 border border-green-500/30';
        });

        audio.addEventListener('timeupdate', () => {
            const progressValue = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
            progress.value = progressValue;
            currentTimeEl.textContent = formatTime(audio.currentTime || 0);
        });

        audio.addEventListener('play', () => {
            playPauseBtn.textContent = 'Pause';
            playState.textContent = 'Playing';
            playState.className = 'text-xs px-2 py-1 rounded-full bg-green-900/60 text-green-300 border border-green-500/30';
        });

        audio.addEventListener('pause', () => {
            playPauseBtn.textContent = 'Play';
            playState.textContent = 'Paused';
            playState.className = 'text-xs px-2 py-1 rounded-full bg-yellow-900/60 text-yellow-300 border border-yellow-500/30';
        });

        audio.addEventListener('ended', () => {
            playNext();
        });

        progress.addEventListener('input', () => {
            if (audio.duration) {
                audio.currentTime = (progress.value / 100) * audio.duration;
            }
        });

        playPauseBtn.addEventListener('click', togglePlay);
        nextBtn.addEventListener('click', playNext);
        prevBtn.addEventListener('click', playPrev);

        loadTrack(currentIndex);
        renderPlaylist();
    </script>
</body>
</html>
