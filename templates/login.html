<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Sign in | Tutor Bot</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
	<style>
		:root { --ink: #18251f; --muted: #64736b; --paper: #f4f0e8; --cream: #fffdf8; --lime: var(--user-accent); --coral: #fff; }
		* { box-sizing: border-box; }
		body { margin: 0; min-height: 100vh; color: var(--ink); background: var(--paper); font-family: 'DM Sans', sans-serif; }
		.page { position: relative; z-index: 1; min-height: 100vh; display: grid; place-items: center; padding: 24px 0; background: radial-gradient(circle at 86% 8%, var(--user-accent-glow), transparent 23rem), var(--paper); }
		.shell { width: min(100% - 48px, 440px); }
		.brand { display: inline-flex; align-items: center; gap: 11px; color: var(--ink); text-decoration: none; font: 700 18px 'Space Grotesk', sans-serif; letter-spacing: -.03em; }
		.brand-mark { width: 31px; height: 31px; display: grid; place-items: center; border-radius: 10px 10px 10px 3px; background: var(--ink); color: var(--lime); }
		.panel { position: relative; margin-top: 28px; padding: 36px; background: #fff; color: #18251f; border: 1px solid rgba(24,37,31,.2); border-radius: 5px; box-shadow: 12px 13px 0 var(--coral), 0 24px 50px rgba(24,37,31,.16); }
		.panel::before { content: ''; position: absolute; top: -1px; left: 36px; width: 72px; height: 5px; background: var(--user-accent); border-radius: 0 0 4px 4px; }
		h1 { margin: 0; color: #18251f; font: 700 36px/.98 'Space Grotesk', sans-serif; letter-spacing: -.055em; }
		.intro { margin: 12px 0 24px; color: #64736b; line-height: 1.5; font-size: 14px; }
		.google { width: 100%; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 12px 19px; color: var(--user-accent-text); background: var(--user-accent); border: 1px solid var(--ink); border-radius: 4px; text-decoration: none; font-weight: 700; box-shadow: 4px 4px 0 var(--ink); transition: transform .2s, box-shadow .2s; cursor: pointer; }
		.google:hover { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
		.google-mark { font-size: 18px; font-weight: 700; }
		.divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; color: #64736b; font-size: 12px; }
		.divider::before, .divider::after { content: ''; height: 1px; flex: 1; background: rgba(24,37,31,.14); }
		.input-group { margin-bottom: 14px; text-align: left; }
		.input-group label { display: block; font-size: 12px; font-weight: 600; color: #18251f; margin-bottom: 4px; }
		.input-group input { width: 100%; padding: 10px 12px; border: 1px solid rgba(24,37,31,.2); border-radius: 4px; font-size: 14px; outline: none; }
		.input-group input:focus { border-color: var(--ink); }
		.btn-stack { display: flex; gap: 10px; margin-top: 18px; }
		.btn-primary, .btn-secondary { flex: 1; padding: 11px; font-weight: 700; font-size: 13px; border-radius: 4px; cursor: pointer; border: 1px solid var(--ink); text-align: center; }
		.btn-primary { background: var(--ink); color: #fff; }
		.btn-secondary { background: transparent; color: var(--ink); }
		.continue { display: block; text-align: center; color: #64736b; font-size: 13px; font-weight: 600; text-decoration: none; margin-top: 18px; }
		.continue:hover { color: var(--ink); }
		.error { margin: 0 0 18px; padding: 10px 12px; color: #8b2f20; background: #ffe5df; border: 1px solid #f2b5a6; border-radius: 4px; font-size: 13px; }
		@media (max-width: 520px) { .shell { width: min(100% - 32px, 440px); } .panel { padding: 28px 22px; } h1 { font-size: 30px; } }
	</style>
	<script src="{{ url_for('static', filename='theme.js') }}"></script>
</head>
<body>
	<div class="page">
		<main class="shell">
			<a class="brand" href="/"><span class="brand-mark">✦</span> Tutor Bot</a>
			<section class="panel">
				<h1>Welcome back.</h1>
				<p class="intro">Sign in to return to your focused study workspace.</p>
				{% if error %}<p class="error">{{ error }}</p>{% endif %}

				{% if google_enabled %}
				<a class="google" href="/login/google"><span class="google-mark">G</span> Continue with Google</a>
				<div class="divider">or use email</div>
				{% endif %}

				<form method="POST" action="/login">
					<div class="input-group">
						<label for="email">Email address</label>
						<input type="email" id="email" name="email" required placeholder="you@example.com">
					</div>
					<div class="input-group">
						<label for="password">Password</label>
						<input type="password" id="password" name="password" required placeholder="••••••••">
					</div>
					<div class="btn-stack">
						<button type="submit" name="action" value="login" class="btn-primary">Sign In</button>
						<button type="submit" name="action" value="signup" class="btn-secondary">Sign Up</button>
					</div>
				</form>

				<a class="continue" href="/">Back to landing page</a>
			</section>
		</main>
	</div>
</body>
</html>
