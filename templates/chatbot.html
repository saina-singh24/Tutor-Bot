<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor Lamp - Chatbot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
    <style>
        body { background: #090d16; color: #f3f4f6; font-family: sans-serif; }
        .glass { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .pulse-glow { box-shadow: 0 0 20px rgba(99, 102, 241, 0.4); }
        #chatLog::-webkit-scrollbar { width: 6px; }
        #chatLog::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); border-radius: 8px; }
        #chatLog::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.5); border-radius: 8px; }
        #chatLog::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.8); }
    </style>
</head>
<body class="min-h-screen p-6">
    <div class="max-w-4xl mx-auto min-h-[calc(100vh-3rem)] flex flex-col">
        <header class="flex justify-between items-center mb-6 flex-shrink-0">
            <div class="flex items-center space-x-3">
                <button id="openSidebar" class="p-2 rounded-xl glass hover:bg-gray-800 text-gray-300 transition focus:outline-none" aria-label="Open navigation menu">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <div class="w-4 h-4 rounded-full bg-indigo-500 animate-ping"></div>
                <div>
                    <h1 class="text-2xl font-bold tracking-wider text-indigo-400">TUTOR BOT</h1>
                    <p class="text-xs text-gray-400">Chatbot workspace</p>
                </div>
            </div>
            <a href="/app" class="px-4 py-2 glass rounded-xl text-sm font-semibold hover:bg-gray-800 text-gray-300">← Dashboard</a>
        </header>

        <main class="glass rounded-2xl p-6 flex flex-col flex-1 min-h-0">
            <div class="flex-shrink-0 mb-5">
                <span class="text-xs font-semibold text-indigo-400 uppercase tracking-wider">Your study companion</span>
                <h2 class="text-3xl font-bold text-gray-100 mt-2">What are you working through?</h2>
                <p class="text-sm text-gray-400 mt-2">Ask a question or attach notes and homework for a concise explanation.</p>
                <button id="startVoiceBtn" onclick="initVoiceSystem()" class="w-full mt-4 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-bold transition pulse-glow">
                    <span id="voiceStatusText">🎤 Start Voice Assistant</span>
                </button>
            </div>

            <div id="chatLog" class="flex-1 overflow-y-auto space-y-3 pr-2 min-h-[240px] mb-4">
                <div class="bg-indigo-950/30 p-4 rounded-xl border border-indigo-500/30">
                    <span class="text-xs font-bold text-indigo-400 block mb-1">Tutor Lamp</span>
                    <p class="text-gray-200">Hi, I’m ready to help. What would you like to understand?</p>
                </div>
            </div>

            <div id="filePreview" class="hidden flex items-center justify-between bg-indigo-950/60 border border-indigo-500/40 px-3 py-2 rounded-xl mb-3 text-xs text-indigo-200 flex-shrink-0">
                <span id="fileNameDisplay" class="truncate max-w-[80%]"></span>
                <button onclick="clearAttachment()" class="text-red-400 hover:text-red-300 font-bold ml-2" aria-label="Remove attachment">✕</button>
            </div>

            <div class="flex space-x-2 flex-shrink-0">
                <input type="file" id="fileAttachment" class="hidden" accept="image/*,.pdf,.txt,.py,.js,.html" onchange="handleFileSelect(event)">
                <button onclick="document.getElementById('fileAttachment').click()" class="p-3 glass hover:bg-gray-800 text-indigo-400 rounded-xl transition border border-indigo-500/30" title="Attach a homework image or document" aria-label="Attach a homework image or document">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path></svg>
                </button>
                <button id="openCameraBtn" class="p-3 glass hover:bg-gray-800 text-indigo-400 rounded-xl transition border border-indigo-500/30" title="Open camera for a photo of your work" aria-label="Open camera for a photo of your work">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h2l1.2-2.4A2 2 0 0110.1 4h3.8a2 2 0 011.9 1.6L17 7h2a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V9zm9 3a3 3 0 110-6 3 3 0 010 6z"></path></svg>
                </button>
                <input type="text" id="manualQuery" placeholder="Ask Tutor Lamp anything..." class="flex-1 bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500" onkeypress="if(event.key === 'Enter') sendManualQuery()">
                <button onclick="sendManualQuery()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-xl text-sm font-semibold">Ask</button>
            </div>
        </main>
    </div>

    <div id="cameraModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 p-4">
        <div class="glass rounded-2xl p-4 w-full max-w-xl border border-indigo-500/30">
            <div class="flex items-center justify-between mb-3">
                <h3 class="text-lg font-bold text-indigo-300">Take a photo of your work</h3>
                <button onclick="closeCameraModal()" class="text-gray-300 hover:text-white text-xl">✕</button>
            </div>
            <video id="cameraPreview" class="w-full h-72 rounded-xl bg-black object-cover" autoplay playsinline muted></video>
            <canvas id="cameraCanvas" class="hidden"></canvas>
            <div class="flex justify-between gap-3 mt-4">
                <button onclick="closeCameraModal()" class="flex-1 px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-xl text-sm font-semibold">Cancel</button>
                <button onclick="captureCameraPhoto()" class="flex-1 px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-xl text-sm font-semibold">Capture</button>
            </div>
        </div>
    </div>

    <script>
        let selectedFile = null;
        let cameraStream = null;
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isSpeaking = false;
        let isProcessing = false;
        let voiceActive = false;
        let answerSpeechEnabled = false;

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            selectedFile = file;
            document.getElementById('fileNameDisplay').innerText = `📎 ${file.name}`;
            document.getElementById('filePreview').classList.remove('hidden');
        }

        function clearAttachment() {
            selectedFile = null;
            document.getElementById('fileAttachment').value = '';
            document.getElementById('filePreview').classList.add('hidden');
        }

        async function openCameraModal() {
            const modal = document.getElementById('cameraModal');
            const video = document.getElementById('cameraPreview');

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert('Camera access is not supported in this browser.');
                return;
            }

            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' },
                    audio: false
                });
                video.srcObject = cameraStream;
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            } catch (error) {
                alert('Camera could not be opened. Please allow camera access or use the file upload option instead.');
            }
        }

        function closeCameraModal() {
            const modal = document.getElementById('cameraModal');
            const video = document.getElementById('cameraPreview');
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
            }
            if (video) video.srcObject = null;
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function captureCameraPhoto() {
            const video = document.getElementById('cameraPreview');
            const canvas = document.getElementById('cameraCanvas');
            const ctx = canvas.getContext('2d');

            canvas.width = video.videoWidth || 1280;
            canvas.height = video.videoHeight || 720;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob((blob) => {
                if (!blob) return;
                const file = new File([blob], `camera-capture-${Date.now()}.png`, { type: 'image/png' });
                selectedFile = file;
                document.getElementById('fileNameDisplay').innerText = `📷 ${file.name}`;
                document.getElementById('filePreview').classList.remove('hidden');
                closeCameraModal();
            }, 'image/png');
        }

        async function sendManualQuery() {
            const input = document.getElementById('manualQuery');
            const query = input.value.trim();
            if (!query && !selectedFile) return;

            const formData = new FormData();
            formData.append('query', query || 'Please analyze this homework attachment and help me out.');
            if (selectedFile) formData.append('file', selectedFile);

            const displayMsg = selectedFile ? `${query ? query + ' ' : ''}[Attached: ${selectedFile.name}]` : query;
            input.value = '';
            clearAttachment();
            appendMessage('Student', displayMsg, 'text-gray-300', 'bg-gray-800/40');

            try {
                const response = await fetch('/ask', { method: 'POST', body: formData });
                const data = await response.json();
                appendMessage('Tutor Lamp', data.response, 'text-indigo-400', 'bg-indigo-950/30 border-indigo-500/30');
                speakText(data.response, false);
            } catch (error) {
                appendMessage('Tutor Lamp', 'Error connecting to Tutor Lamp.', 'text-red-400', 'bg-red-950/30 border-red-500/30');
            }
        }

        function appendMessage(sender, message, colorClass, backgroundClass) {
            const log = document.getElementById('chatLog');
            log.innerHTML += `<div class="${backgroundClass} p-4 rounded-xl border flex-shrink-0"><span class="text-xs font-bold ${colorClass} block mb-1">${sender}</span><p class="text-gray-200">${message}</p></div>`;
            log.scrollTop = log.scrollHeight;
        }

        document.getElementById('openCameraBtn').addEventListener('click', openCameraModal);

        function toggleVoiceSystem() {
            if (voiceActive) stopVoiceSystem('Voice assistant stopped.');
            else initVoiceSystem();
        }

        function initVoiceSystem() {
            if (!SpeechRecognition) {
                alert('Please use Google Chrome or Microsoft Edge.');
                return;
            }

            voiceActive = true;
            answerSpeechEnabled = true;
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                document.getElementById('voiceStatusText').innerText = "🟢 Listening (Say 'Tutor bot stop' to end)";
                document.getElementById('startVoiceBtn').className = 'w-full mt-4 py-3 rounded-xl bg-green-950/60 border border-green-500/40 text-green-300 font-bold transition';
                document.getElementById('startVoiceBtn').setAttribute('onclick', 'toggleVoiceSystem()');
            };

            recognition.onresult = async event => {
                if (isSpeaking || isProcessing || !voiceActive) return;
                const rawTranscript = event.results[0][0].transcript.trim().toLowerCase();
                if (rawTranscript.length < 2) return;
                if (rawTranscript.includes('tutor bot stop') || rawTranscript === 'stop' || rawTranscript.includes('stop voice')) {
                    stopVoiceSystem('Voice assistant turned off.');
                    return;
                }

                isProcessing = true;
                let query = rawTranscript;
                if (query.startsWith('hey tutor bot')) query = query.replace(/hey tutor bot/i, '').trim();
                else if (query.startsWith('tutor bot')) query = query.replace(/tutor bot/i, '').trim();

                if (!query) {
                    const greeting = "I'm listening, go ahead!";
                    appendMessage('Tutor Lamp', greeting, 'text-indigo-400', 'bg-indigo-950/30 border-indigo-500/30');
                    speakText(greeting, answerSpeechEnabled && voiceActive);
                    isProcessing = false;
                    return;
                }

                appendMessage('Student', query, 'text-gray-300', 'bg-gray-800/40');
                await queryAI(query);
                isProcessing = false;
            };

            recognition.onerror = () => {
                isProcessing = false;
                if (voiceActive) restartRecognition();
            };
            recognition.onend = () => {
                if (voiceActive && !isSpeaking && !isProcessing) restartRecognition();
            };
            try { recognition.start(); } catch (error) {}
        }

        function stopVoiceSystem(message) {
            voiceActive = false;
            answerSpeechEnabled = false;
            isProcessing = false;
            isSpeaking = false;
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            if (recognition) {
                try { recognition.abort(); } catch (error) {}
                recognition = null;
            }
            document.getElementById('voiceStatusText').innerText = '🎤 Start Voice Assistant';
            document.getElementById('startVoiceBtn').className = 'w-full mt-4 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-bold transition pulse-glow';
            document.getElementById('startVoiceBtn').setAttribute('onclick', 'initVoiceSystem()');
            if (message) appendMessage('Tutor Lamp', message, 'text-red-400', 'bg-red-950/30 border-red-500/30');
        }

        function restartRecognition() {
            setTimeout(() => {
                if (recognition && voiceActive && !isSpeaking && !isProcessing) {
                    try { recognition.start(); } catch (error) {}
                }
            }, 300);
        }

        async function queryAI(query) {
            const formData = new FormData();
            formData.append('query', query);
            try {
                const response = await fetch('/ask', { method: 'POST', body: formData });
                const data = await response.json();
                appendMessage('Tutor Lamp', data.response, 'text-indigo-400', 'bg-indigo-950/30 border-indigo-500/30');
                speakText(data.response, answerSpeechEnabled && voiceActive);
            } catch (error) {
                appendMessage('Tutor Lamp', 'Error connecting to AI.', 'text-red-400', 'bg-red-950/30 border-red-500/30');
                if (voiceActive) restartRecognition();
            }
        }

        function speakText(text, shouldSpeak = false) {
            if (!shouldSpeak || !('speechSynthesis' in window) || !text || !text.trim()) {
                if (voiceActive) restartRecognition();
                return;
            }

            isSpeaking = true;
            if (recognition && voiceActive) {
                try { recognition.stop(); } catch (error) {}
            }

            const utterance = new SpeechSynthesisUtterance(text);
            const finishSpeech = () => {
                isSpeaking = false;
                if (voiceActive) restartRecognition();
            };
            utterance.onend = finishSpeech;
            utterance.onerror = finishSpeech;
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        }
    </script>
    <script src="{{ url_for('static', filename='sidebar.js') }}"></script>
</body>
</html>
